
services:
  dotnet:
    container_name: projeto_dotnet
    build: .
    networks:
      - tg
    volumes:
      - .:/var/www/app
    cpus: 2
    restart: unless-stopped
    mem_limit: 2g

  db:
    image: mysql:8.0
    container_name: db
    restart: unless-stopped
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - tg

  proxy-reverse:
    image: nginx:stable
    restart: unless-stopped
    container_name: proxy-reverse
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - tg
    depends_on:
      - dotnet

volumes:
  mysql_data:
    driver: local

networks:
  tg:
    driver: bridge
    
